<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection - Dar Mohammed Boutique</title>
    <link rel="stylesheet" href="style.css?v=30">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/nav.png">
    <link rel="apple-touch-icon" href="assets/nav.png">
    <style>
        body {
            overflow-y: auto;
            align-items: flex-start;
        }
        .collection-container {
            width: 95%;
            max-width: 1200px;
            margin: 2rem auto;
            z-index: 1;
            position: relative;
            animation: fadeIn 1.2s ease-out;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-white);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            font-size: 1rem;
            margin-bottom: 2rem;
            transition: var(--transition);
        }
        .back-btn i {
            color: var(--primary-gold);
        }
        .back-btn:hover {
            transform: translateX(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1.2rem;
            padding-bottom: 3rem;
        }
        .gallery-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            aspect-ratio: 1 / 1.2;
        }
        .gallery-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: var(--primary-gold);
        }
        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
            transition: opacity 0.8s ease-in-out, transform 0.3s ease;
            opacity: 0;
        }
        .gallery-item:hover .gallery-img {
            transform: scale(1.1);
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="collection-container">
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> BACK TO HOME</a>
        
        <div class="brands-header" style="margin-bottom: 2.5rem;">
            <span class="line"></span>
            <span class="title" style="font-size: 1.2rem;">EXCLUSIVE TOP SELECTION</span>
            <span class="line"></span>
        </div>

        <div class="gallery-grid">
            <div class="gallery-item"><img data-src="images/1.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/2.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/3.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/4.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/5.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/6.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/7.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/8.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/9.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/10.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/11.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/12.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/13.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/14.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/15.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/16.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/18.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/19.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/20.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
            <div class="gallery-item"><img data-src="images/21.png" class="gallery-img lazy-img" alt="Luxury Item"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const lazyImages = document.querySelectorAll("img.lazy-img");

            if ("IntersectionObserver" in window) {
                const lazyImageObserver = new IntersectionObserver(function(entries, observer) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            const lazyImage = entry.target;
                            lazyImage.src = lazyImage.dataset.src;
                            lazyImage.onload = () => {
                                lazyImage.style.opacity = 1;
                            };
                            lazyImageObserver.unobserve(lazyImage);
                        }
                    });
                }, { rootMargin: "0px 0px 300px 0px" });

                lazyImages.forEach(function(lazyImage) {
                    lazyImageObserver.observe(lazyImage);
                });
            } else {
                lazyImages.forEach(function(lazyImage) {
                    lazyImage.src = lazyImage.dataset.src;
                    lazyImage.style.opacity = 1;
                });
            }
        });
    </script>
</body>
</html>
